<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Số - Công Nghệ Kỹ Thuật In</title>
    <!-- Thư viện Font Awesome cho các Icon Facebook, LinkedIn,... -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b2b26;
            --card-bg: #e6fcfc;
            --banner-bg: #4ee0e6;
            --text-color: #000000;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            color: var(--text-color); 
            transition: background-color 0.3s;
        }

        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1100px; 
            margin: 0 auto 40px auto; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 40px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .profile-section { display: flex; flex-direction: column; align-items: center; width: 220px; text-align: center; }
        
        .avatar-circle { 
            width: 160px; 
            height: 160px; 
            background-color: #5b5b5b; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            font-size: 28px; 
            font-weight: bold;
            margin-bottom: 15px; 
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 4px solid #fff;
        }

        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #000; }
        
        .info-section { flex-grow: 1; margin-left: 40px; font-size: 17px; line-height: 1.8; font-weight: 600; color: #111; }
        .info-section p { margin: 6px 0; }
        
        /* Grid hiển thị các Card mở */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        /* Thẻ hiển thị mở theo mẫu thiết kế */
        .section-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Thanh tiêu đề Banner bo góc */
        .section-banner {
            background-color: var(--banner-bg);
            color: #000000;
            padding: 18px 25px;
            font-size: 22px;
            font-weight: 900;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            letter-spacing: 0.5px;
        }

        /* Phần nội dung chi tiết bên dưới */
        .section-body {
            padding: 25px;
            font-size: 16px;
            line-height: 1.7;
            color: #111;
            flex-grow: 1;
        }

        .section-body ul {
            padding-left: 20px;
            margin: 0;
        }
        
        .media-box { margin-top: 18px; padding: 15px; background: rgba(255, 255, 255, 0.7); border-radius: 12px; border: 1px solid rgba(0,0,0,0.05); }
        .link-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
        .btn-link-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #0f9d58;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .btn-link-badge i { font-size: 18px; }
        .btn-link-badge:hover {
            background: #0b8043;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
        }

        .video-container { margin-top: 12px; width: 100%; aspect-ratio: 16 / 9; }
        .video-container iframe, .video-container video { width: 100%; height: 100%; border-radius: 8px; border: none; }

        @media (max-width: 900px) {
            .header-container { flex-direction: column; text-align: center; padding: 25px; }
            .info-section { margin: 20px 0; text-align: left; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="profile-section">
            <div class="avatar-circle" id="avatarDisplay">Avatar</div>
            <div class="profile-name" id="nameDisplay">HỌ VÀ TÊN</div>
        </div>
        <div class="info-section">
            <p>Trường: <span id="schoolDisplay">ĐH Sư Phạm Kỹ Thuật TP.HCM</span></p>
            <p>Ngành: <span id="majorDisplay">Công nghệ Kỹ thuật In</span></p>
            <p>Khóa: <span id="courseDisplay">K2021 (Năm 3)</span></p>
            <p>Mã số sinh viên: <span id="studentIdDisplay">21150000</span></p>
            <p>Số điện thoại: <span id="phoneDisplay">0901234567</span></p>
            <p>Gmail: <span id="emailDisplay">sinhvien@example.com</span></p>
        </div>
    </div>

    <!-- Danh sách các thẻ hiển thị trực tiếp -->
    <div class="grid-container" id="gridContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBQG-sillO8bUFeYPNam0id7KrJ_NaBpyo",
          authDomain: "cv-luong-hoang-phuc.firebaseapp.com",
          databaseURL: "https://cv-luong-hoang-phuc-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "cv-luong-hoang-phuc",
          storageBucket: "cv-luong-hoang-phuc.firebasestorage.app",
          messagingSenderId: "278907045649",
          appId: "1:278907045649:web:2221db3506973baccd6eb0",
          measurementId: "G-3HYL9FLGN2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const sectionKeys = ['gioi-thieu', 'mang-xa-hoi', 'ky-nang', 'chung-chi', 'kinh-nghiem', 'du-an'];

        const defaultPortfolioData = {
            'gioi-thieu': {
                title: "1. Giới thiệu",
                content: `
                    <p style="margin-bottom: 12px; font-weight: bold; font-size: 17px;">Sinh viên năm 3 - Chuyên ngành Công nghệ Kỹ thuật In</p>
                    <ul style="line-height: 1.8;">
                        <li><strong>Kiến thức nền tảng:</strong> Hiểu biết tốt về các công nghệ in Offset, Flexo, KTS, Lụa, Ống đồng và cả 3 giai đoạn (Chế bản &rarr; In &rarr; Thành phẩm).</li>
                        <li><strong>Kinh nghiệm thực tế:</strong> Đã hoàn thành 2 kỳ thực tập chuyên ngành.</li>
                        <li><strong>Đồ án đã thực hiện:</strong> Thiết kế cấu trúc, Trình bày ấn phẩm, Chế bản, Thành phẩm...</li>
                    </ul>
                `
            },
            'mang-xa-hoi': {
                title: "2. Mạng xã hội & Liên hệ",
                content: "<ul><li><strong>LinkedIn:</strong> linkedin.com/in/tensinhvien</li><li><strong>Email:</strong> email@example.com</li><li><strong>Khu vực:</strong> TP. Hồ Chí Minh</li></ul>"
            },
            'ky-nang': {
                title: "3. Kỹ năng chuyên môn",
                content: "<ul><li><strong>Công nghệ in:</strong> Offset tờ rời, Flexo, In kỹ thuật số.</li><li><strong>Phần mềm:</strong> Adobe CC, Esko, Pitstop, i1Profiler, Prinect.</li><li><strong>Tiêu chuẩn:</strong> ISO 12647, Cân bằng xám G7.</li></ul>"
            },
            'chung-chi': {
                title: "4. Chứng chỉ & Khóa học",
                content: "<ul><li>Chứng chỉ Quản lý Màu G7 (G7 Expert - cơ bản).</li><li>Chứng nhận An toàn Lao động & Môi trường.</li><li>Khóa học Xử lý file Preflight PDF/X.</li></ul>"
            },
            'kinh-nghiem': {
                title: "5. Kinh nghiệm thực tập",
                content: "<strong>Công ty Bao bì X</strong><br>Vị trí: Thực tập sinh QC & Quản lý màu.<br>Thực hiện kiểm tra bài in, đo đạc thông số màu sắc, và báo cáo dữ liệu định kỳ."
            },
            'du-an': {
                title: "6. Dự án tiêu biểu (Mô hình CAR)",
                content: "<strong>Dự án: Ổn định màu đơn hàng hộp giấy (Offset tờ rời)</strong><br><ul><li><strong>Bối cảnh (C):</strong> Khách hàng phàn nàn màu sắc không đồng đều giữa các ca in.</li><li><strong>Hành động (A):</strong> Dùng máy đo X-Rite, hiệu chỉnh đường cong TVI theo chuẩn G7.</li><li><strong>Kết quả (R):</strong> Giảm độ lệch màu trung bình từ 3.4 xuống 1.7. Giảm 15% phế phẩm.</li></ul>"
            }
        };

        let currentPortfolioData = defaultPortfolioData;

        function renderAllSections() {
            const container = document.getElementById('gridContainer');
            let html = '';

            sectionKeys.forEach(key => {
                const data = currentPortfolioData[key] || defaultPortfolioData[key];
                if (!data) return;

                let contentHtml = (data.content && data.content.trim() !== "") ? `<div>${data.content}</div>` : "";

                // Liên kết đính kèm
                if (data.links && Array.isArray(data.links) && data.links.length > 0) {
                    contentHtml += `
                        <div class="media-box">
                            <strong>🔗</strong>
                            <div class="link-buttons">
                    `;
                    data.links.forEach(item => {
                        if (item.url && item.url.trim() !== "") {
                            const buttonTitle = (item.label && item.label.trim() !== "") ? item.label : "Mở Xem Tài Liệu";
                            let iconHtml = '<i class="fa-solid fa-globe"></i>';
                            const labelLower = buttonTitle.toLowerCase();
                            const urlLower = item.url.toLowerCase();

                            if (labelLower.includes('facebook') || urlLower.includes('facebook.com') || urlLower.includes('fb.com')) {
                                iconHtml = '<i class="fa-brands fa-facebook"></i>';
                            } else if (labelLower.includes('linkedin') || urlLower.includes('linkedin.com')) {
                                iconHtml = '<i class="fa-brands fa-linkedin"></i>';
                            }

                            contentHtml += `<a href="${item.url}" target="_blank" class="btn-link-badge">${iconHtml} ${buttonTitle}</a>`;
                        }
                    });
                    contentHtml += `</div></div>`;
                }

                // Video đính kèm
                if (data.videos && Array.isArray(data.videos) && data.videos.length > 0) {
                    contentHtml += `<div class="media-box"><strong>🎬 Video Minh Họa:</strong>`;
                    data.videos.forEach(item => {
                        if (item.url && item.url.trim() !== "") {
                            let videoHtml = "";
                            if (item.url.includes('youtube.com') || item.url.includes('youtu.be')) {
                                let embedUrl = item.url.replace('watch?v=', 'embed/');
                                videoHtml = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
                            } else {
                                videoHtml = `<video controls src="${item.url}"></video>`;
                            }
                            htmlContent += `<div class="video-container">${videoHtml}</div>`;
                        }
                    });
                    contentHtml += `</div>`;
                }

                html += `
                    <div class="section-card">
                        <div class="section-banner">${data.title || "Nội dung"}</div>
                        <div class="section-body">${contentHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function listenRealtimeData() {
            onValue(ref(db, 'portfolioData'), (snapshot) => {
                if (!snapshot.exists()) {
                    renderAllSections();
                    return;
                }
                const parsed = snapshot.val();

                if (parsed.personal) {
                    if (parsed.personal.name) document.getElementById('nameDisplay').innerText = parsed.personal.name;
                    if (parsed.personal.school) document.getElementById('schoolDisplay').innerText = parsed.personal.school;
                    if (parsed.personal.major) document.getElementById('majorDisplay').innerText = parsed.personal.major;
                    if (parsed.personal.course) document.getElementById('courseDisplay').innerText = parsed.personal.course;
                    if (parsed.personal.studentId) document.getElementById('studentIdDisplay').innerText = parsed.personal.studentId;
                    if (parsed.personal.phone) document.getElementById('phoneDisplay').innerText = parsed.personal.phone;
                    if (parsed.personal.email) document.getElementById('emailDisplay').innerText = parsed.personal.email;

                    if (parsed.personal.avatar) {
                        document.getElementById('avatarDisplay').innerHTML = `<img src="${parsed.personal.avatar}" alt="Avatar">`;
                    }
                }

                if (parsed.theme) {
                    const r = document.querySelector(':root');
                    if (parsed.theme.bgColor) r.style.setProperty('--bg-color', parsed.theme.bgColor);
                    if (parsed.theme.btnColor) r.style.setProperty('--banner-bg', parsed.theme.btnColor);
                    if (parsed.theme.textColor) r.style.setProperty('--text-color', parsed.theme.textColor);
                }

                if (parsed.sections) {
                    currentPortfolioData = parsed.sections;
                }
                
                renderAllSections();
            });
        }

        window.onload = function() {
            renderAllSections();
            listenRealtimeData();
        };
    </script>
</body>
</html>
